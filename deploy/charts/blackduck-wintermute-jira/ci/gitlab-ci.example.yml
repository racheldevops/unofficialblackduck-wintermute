variables:
  HELM_WINTERMUTE_CHART: deploy/charts/blackduck-wintermute-jira
  HELM_WINTERMUTE_NAME: wintermute-jira
  HELM_WINTERMUTE_TIMEOUT: 10m

  WINTERMUTE_CRONJOB_NAME: blackduck-jira-pipeline
  WINTERMUTE_IMAGE_PULL_POLICY: Always
  WINTERMUTE_IMAGE_PULL_SECRET: wintermute-registry-credentials
  WINTERMUTE_RUNTIME_SECRET: blackduck-wintermute-credentials

  WINTERMUTE_PVC_SIZE: 10Gi
  WINTERMUTE_STORAGE_CLASS: ""
  WINTERMUTE_CRON_SCHEDULE: "0 2 * * *"
  WINTERMUTE_TIME_ZONE: Europe/Berlin

  WINTERMUTE_CRON_SUSPEND: "true"
  WINTERMUTE_PIPELINE_MODE: dry-run
  WINTERMUTE_CONFIRM_APPLY: "false"
  WINTERMUTE_MAX_CREATE: "10"

  WINTERMUTE_WORKERS: "1"
  WINTERMUTE_PARENT_WORKERS: "1"
  WINTERMUTE_ROLLUP_WORKERS: "1"
  WINTERMUTE_PAGE_LIMIT: "100"
  WINTERMUTE_EXCLUDE_PARENT_PROJECTS: "[]"
  WINTERMUTE_EXCLUDE_CHILD_PROJECTS: "[]"
  WINTERMUTE_LOCK_STALE_SECONDS: "10800"

  WINTERMUTE_JIRA_VERIFY_TLS: "true"
  WINTERMUTE_BLACKDUCK_INSECURE: "false"
  WINTERMUTE_CA_BUNDLE_CONFIGMAP: ""

helm:deploy:wintermute-jira:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  image: $DEPLOY_TOOLS_IMAGE
  script:
    - |
      set -eu
      set +x

      command -v helm >/dev/null 2>&1 || {
        echo "Required command is missing: helm" >&2
        exit 1
      }

      : "${KUBE_NAMESPACE:?KUBE_NAMESPACE is required}"
      : "${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}"
      : "${JIRA_URL:?JIRA_URL is required}"
      : "${JIRA_PROJECT_KEY:?JIRA_PROJECT_KEY is required}"
      : "${WINTERMUTE_IMAGE_PULL_SECRET:?WINTERMUTE_IMAGE_PULL_SECRET is required}"
      : "${WINTERMUTE_RUNTIME_SECRET:?WINTERMUTE_RUNTIME_SECRET is required}"

      if test -z "${IMAGE_TAG:-}"; then
        image_name="${IMAGE_REPOSITORY##*/}"

        case "${image_name}" in
          *:*)
            IMAGE_TAG="${image_name##*:}"
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY%:*}"
            export IMAGE_TAG IMAGE_REPOSITORY
            ;;
          *)
            echo "IMAGE_TAG is required unless IMAGE_REPOSITORY includes :tag" >&2
            exit 1
            ;;
        esac
      fi

      case "${WINTERMUTE_IMAGE_PULL_POLICY}" in
        Always|IfNotPresent|Never)
          ;;
        *)
          echo "Invalid WINTERMUTE_IMAGE_PULL_POLICY" >&2
          exit 1
          ;;
      esac

      helm upgrade \
        --install \
        --atomic \
        --timeout "${HELM_WINTERMUTE_TIMEOUT}" \
        --namespace "${KUBE_NAMESPACE}" \
        --set-string "fullnameOverride=${WINTERMUTE_CRONJOB_NAME}" \
        --set-string "image.repository=${IMAGE_REPOSITORY}" \
        --set-string "image.tag=${IMAGE_TAG}" \
        --set-string "image.pullPolicy=${WINTERMUTE_IMAGE_PULL_POLICY}" \
        --set-string "imagePullSecrets[0].name=${WINTERMUTE_IMAGE_PULL_SECRET}" \
        --set-string "credentials.existingSecret=${WINTERMUTE_RUNTIME_SECRET}" \
        --set-string "jira.url=${JIRA_URL}" \
        --set-string "jira.projectKey=${JIRA_PROJECT_KEY}" \
        --set "jira.verifyTls=${WINTERMUTE_JIRA_VERIFY_TLS}" \
        --set-string "persistence.storageClass=${WINTERMUTE_STORAGE_CLASS}" \
        --set-string "persistence.size=${WINTERMUTE_PVC_SIZE}" \
        --set-string "cronJob.schedule=${WINTERMUTE_CRON_SCHEDULE}" \
        --set-string "cronJob.timeZone=${WINTERMUTE_TIME_ZONE}" \
        --set "cronJob.suspend=${WINTERMUTE_CRON_SUSPEND}" \
        --set-string "pipeline.mode=${WINTERMUTE_PIPELINE_MODE}" \
        --set "pipeline.confirmApply=${WINTERMUTE_CONFIRM_APPLY}" \
        --set "pipeline.maxCreate=${WINTERMUTE_MAX_CREATE}" \
        --set "pipeline.workers=${WINTERMUTE_WORKERS}" \
        --set "pipeline.parentWorkers=${WINTERMUTE_PARENT_WORKERS}" \
        --set "pipeline.rollupWorkers=${WINTERMUTE_ROLLUP_WORKERS}" \
        --set "pipeline.pageLimit=${WINTERMUTE_PAGE_LIMIT}" \
        --set-json "pipeline.excludeParentProjects=${WINTERMUTE_EXCLUDE_PARENT_PROJECTS}" \
        --set-json "pipeline.excludeChildProjects=${WINTERMUTE_EXCLUDE_CHILD_PROJECTS}" \
        --set "pipeline.lockStaleSeconds=${WINTERMUTE_LOCK_STALE_SECONDS}" \
        --set "blackDuck.insecure=${WINTERMUTE_BLACKDUCK_INSECURE}" \
        --set-string "caBundle.existingConfigMap=${WINTERMUTE_CA_BUNDLE_CONFIGMAP}" \
        "${HELM_WINTERMUTE_NAME}" \
        "${HELM_WINTERMUTE_CHART}"
  environment:
    name: $KUBE_NAMESPACE
