{{- $jiraURL := required "jira.url is required" .Values.jira.url -}}
{{- $projectKey := required "jira.projectKey is required" .Values.jira.projectKey -}}
{{- $product := .Values.config.product_reporting | default dict -}}
{{- if $product.enabled -}}
{{- if not .Values.pipeline.strict -}}
{{- fail "Product reporting requires pipeline.strict=true" -}}
{{- end -}}
{{- $policy := required "Product policy_custom_field is required" $product.policy_custom_field -}}
{{- $entity := required "Product entity_custom_field is required" $product.entity_custom_field -}}
{{- if or (eq (trim $policy) "") (eq (trim $entity) "") -}}
{{- fail "Product custom-field names must not be blank" -}}
{{- end -}}
{{- if gt (float64 $product.exploit_minimum_score) (float64 $product.minimum_score) -}}
{{- fail "Product exploit_minimum_score cannot exceed minimum_score" -}}
{{- end -}}
{{- end -}}
{{- $jira := dict
      "url" $jiraURL
      "project_key" $projectKey
      "issue_type" .Values.jira.issueType
      "api_version" .Values.jira.apiVersion
      "auth_mode" .Values.jira.authMode
      "verify_tls" .Values.jira.verifyTls
-}}
{{- $payload := dict
      "jira" $jira
      "issue" .Values.config.issue
      "hierarchy" .Values.config.hierarchy
      "product_reporting" $product
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blackduck-wintermute-jira.fullname" . }}-config
  labels:
    {{- include "blackduck-wintermute-jira.labels" . | nindent 4 }}
data:
  jira-rollup-config.json: |
{{ toPrettyJson $payload | indent 4 }}
