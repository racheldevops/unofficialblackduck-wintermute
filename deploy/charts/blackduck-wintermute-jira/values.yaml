nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

credentials:
  existingSecret: blackduck-wintermute-credentials

jira:
  url: ""
  projectKey: ""
  issueType: Task
  apiVersion: "2"
  authMode: basic
  verifyTls: true

blackDuck:
  insecure: false

cronJob:
  schedule: "0 2 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0

pipeline:
  mode: dry-run
  confirmApply: false
  maxCreate: 10
  strict: true
  resolveBomNames: true
  workers: 2
  parentWorkers: 2
  rollupWorkers: 2
  pageLimit: 500
  lockStaleSeconds: 10800
  extraArgs: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

caBundle:
  existingConfigMap: ""
  key: ca.crt
  mountPath: /etc/blackduck-wintermute/customer-ca.crt

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

config:
  issue:
    summary_template: "Black Duck: {alert_severity} Alert - {subproject} - version {subproject_version} - {component} version {component_version}"
    labels:
      - blackduck
      - subproject_rollup
      - BDAlert
    priority_by_severity:
      CRITICAL: Highest
      HIGH: High
      MEDIUM: Medium
      LOW: Low
    alert_severity_by_severity:
      CRITICAL: BLOCKER
      HIGH: HIGH
      MEDIUM: MEDIUM
      LOW: LOW
      UNKNOWN: UNKNOWN
    additional_fields: {}

  hierarchy:
    epic_issue_type: Epic
    story_issue_type: Task
    vulnerability_issue_type: Subtask
    story_parent_mode: jira_parent
    vulnerability_parent_mode: jira_parent
    issue_link_type: Relates
    epic_link_field: ""
    sync_existing_fields: false
    summary_templates:
      story: "Black Duck: {alert_severity} Alert - {affected_project} - version {affected_version} - {component_summary}"
    labels:
      epic:
        - bd_rollup_cve
      story:
        - bd_rollup_project_version
      vulnerability:
        - bd_rollup_vuln
    additional_fields:
      epic: {}
      story: {}
      vulnerability: {}
    field_mappings:
      project_name:
        field_id: ""
        source: affected_project
        node_types:
          - story
        value_type: text
      project_version:
        field_id: ""
        source: affected_version
        node_types:
          - story
        value_type: text
      cvss_vector:
        field_id: ""
        source: cvss_vector
        node_types:
          - story
        value_type: text
      cvss_score:
        field_id: ""
        source: stats.max_score
        node_types:
          - story
        value_type: number
      entity:
        field_id: ""
        source: entity
        node_types:
          - story
        value_type: text
