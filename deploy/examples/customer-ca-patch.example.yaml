apiVersion: batch/v1
kind: CronJob
metadata:
  name: blackduck-jira-pipeline
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: jira-pipeline
              args:
                - --dry-run
                - --strict
                - --resolve-bom-names
                - --workers
                - "8"
                - --parent-workers
                - "8"
                - --rollup-workers
                - "8"
                - --ca-bundle
                - /etc/blackduck-harness/ca/customer-ca.pem
                - --config
                - /etc/blackduck-harness/jira-rollup-config.json
              env:
                - name: SSL_CERT_FILE
                  value: /etc/blackduck-harness/ca/customer-ca.pem
