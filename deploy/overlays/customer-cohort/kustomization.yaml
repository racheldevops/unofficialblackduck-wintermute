apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blackduck-wintermute

resources:
  - ../../cohort
  - namespace.yaml

patches:
  - path: schedule-patch.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: WorkflowTemplate
      name: blackduck-wintermute-cohort
    path: workflow-images-patch.yaml

configMapGenerator:
  - name: blackduck-wintermute-cohort-jira-config
    behavior: replace
    files:
      - jira-rollup-config.json

generatorOptions:
  disableNameSuffixHash: true
