apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: blackduck-wintermute-cohort
spec:
  schedule: "0 2 * * *"
  timezone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  workflowSpec:
    arguments:
      parameters:
        - name: source-image
          value: registry.invalid/customer/blackduck-wintermute-source:replace-me
        - name: jira-image
          value: registry.invalid/customer/blackduck-wintermute-jira:replace-me
        - name: datadog-image
          value: registry.invalid/customer/blackduck-wintermute-datadog:replace-me
        - name: scm-image
          value: registry.invalid/customer/blackduck-wintermute-scm:replace-me
        - name: jira-mode
          value: dry-run
        - name: datadog-mode
          value: dry-run
        - name: scm-mode
          value: disabled
        - name: confirm-apply
          value: "false"
        - name: retain-cohorts
          value: "10"
