apiVersion: batch/v1
kind: CronJob
metadata:
  name: blackduck-jira-pipeline
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          imagePullSecrets:
            - name: blackduck-wintermute-registry
          containers:
            - name: jira-pipeline
              imagePullPolicy: IfNotPresent
              args:
                - --dry-run
                - --strict
                - --resolve-bom-names
                - --workers
                - "8"
                - --parent-workers
                - "8"
                - --rollup-workers
                - "8"
                - --config
                - /etc/blackduck-wintermute/jira-rollup-config.json
              env:
                - name: BLACKDUCK_URL
                  valueFrom:
                    secretKeyRef:
                      name: blackduck-wintermute-credentials
                      key: BLACKDUCK_URL
                - name: BLACKDUCK_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: blackduck-wintermute-credentials
                      key: BLACKDUCK_API_TOKEN
                - name: JIRA_URL
                  valueFrom:
                    secretKeyRef:
                      name: blackduck-wintermute-credentials
                      key: JIRA_URL
                - name: JIRA_USER
                  valueFrom:
                    secretKeyRef:
                      name: blackduck-wintermute-credentials
                      key: JIRA_USER
                - name: JIRA_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: blackduck-wintermute-credentials
                      key: JIRA_API_TOKEN
              resources:
                requests:
                  cpu: "1"
                  memory: 512Mi
                limits:
                  cpu: "4"
                  memory: 2Gi