apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: blackduck-wintermute-cohort
  labels:
    app.kubernetes.io/name: blackduck-wintermute
    app.kubernetes.io/component: cohort
spec:
  entrypoint: cohort
  serviceAccountName: blackduck-wintermute-cohort
  imagePullSecrets:
    - name: blackduck-wintermute-registry
  arguments:
    parameters:
      - name: source-image
        value: blackduck-wintermute-source
      - name: jira-image
        value: blackduck-wintermute-jira
      - name: datadog-image
        value: blackduck-wintermute-datadog
      - name: scm-image
        value: blackduck-wintermute-scm
      - name: jira-mode
        value: dry-run
        enum:
          - disabled
          - dry-run
          - apply
      - name: datadog-mode
        value: dry-run
        enum:
          - disabled
          - dry-run
          - apply
      - name: scm-mode
        value: disabled
        enum:
          - disabled
          - read-only
      - name: confirm-apply
        value: "false"
        enum:
          - "false"
          - "true"
      - name: retain-cohorts
        value: "10"
      - name: jira-only-vulnerability
        value: ""
      - name: jira-max-create
        value: "5000"
      - name: datadog-max-send
        value: "100"
  volumes:
    - name: cohort-data
      persistentVolumeClaim:
        claimName: blackduck-wintermute-cohorts
    - name: source-data
      persistentVolumeClaim:
        claimName: blackduck-wintermute-source-data
    - name: jira-data
      persistentVolumeClaim:
        claimName: blackduck-wintermute-jira-data
    - name: datadog-data
      persistentVolumeClaim:
        claimName: blackduck-wintermute-datadog-data
    - name: scm-data
      persistentVolumeClaim:
        claimName: blackduck-wintermute-scm-data
    - name: jira-config
      configMap:
        name: blackduck-wintermute-cohort-jira-config
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
  templates:
    - name: cohort
      dag:
        failFast: false
        tasks:
          - name: validate-modes
            template: validate-modes
            arguments:
              parameters:
                - name: jira-mode
                  value: "{{workflow.parameters.jira-mode}}"
                - name: datadog-mode
                  value: "{{workflow.parameters.datadog-mode}}"
                - name: scm-mode
                  value: "{{workflow.parameters.scm-mode}}"
                - name: confirm-apply
                  value: "{{workflow.parameters.confirm-apply}}"
          - name: source
            depends: validate-modes.Succeeded
            template: source
          - name: scm
            depends: source.Succeeded
            when: "{{=workflow.parameters['scm-mode'] != 'disabled'}}"
            template: scm
          - name: jira
            depends: source.Succeeded
            when: "{{=workflow.parameters['jira-mode'] != 'disabled'}}"
            template: jira
            arguments:
              parameters:
                - name: cohort-id
                  value: "{{tasks.source.outputs.parameters.cohort-id}}"
          - name: datadog
            depends: >-
              source.Succeeded &&
              (jira.Succeeded || jira.Failed || jira.Errored ||
              jira.Skipped || jira.Omitted)
            when: "{{=workflow.parameters['datadog-mode'] != 'disabled'}}"
            template: datadog
            arguments:
              parameters:
                - name: cohort-id
                  value: "{{tasks.source.outputs.parameters.cohort-id}}"
          - name: finalize
            depends: >-
              source.Succeeded &&
              (datadog.Succeeded || datadog.Failed || datadog.Errored ||
              datadog.Skipped || datadog.Omitted)
            template: finalize
            arguments:
              parameters:
                - name: cohort-id
                  value: "{{tasks.source.outputs.parameters.cohort-id}}"
                - name: jira-status
                  value: "{{tasks.jira.status}}"
                - name: datadog-status
                  value: "{{tasks.datadog.status}}"

    - name: validate-modes
      inputs:
        parameters:
          - name: jira-mode
          - name: datadog-mode
          - name: scm-mode
          - name: confirm-apply
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      script:
        image: "{{workflow.parameters.source-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - python
        source: |
          jira_mode = "{{inputs.parameters.jira-mode}}"
          datadog_mode = "{{inputs.parameters.datadog-mode}}"
          scm_mode = "{{inputs.parameters.scm-mode}}"
          confirmed = "{{inputs.parameters.confirm-apply}}" == "true"

          valid_destination_modes = {"disabled", "dry-run", "apply"}
          valid_scm_modes = {"disabled", "read-only"}

          if jira_mode not in valid_destination_modes:
              raise SystemExit(f"Invalid Jira mode: {jira_mode}")

          if datadog_mode not in valid_destination_modes:
              raise SystemExit(f"Invalid Datadog mode: {datadog_mode}")

          if scm_mode not in valid_scm_modes:
              raise SystemExit(f"Invalid SCM mode: {scm_mode}")

          if "apply" in {jira_mode, datadog_mode} and not confirmed:
              raise SystemExit(
                  "Apply mode requires confirm-apply=true"
              )

          print("Cohort and SCM modes validated.")
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

    - name: source
      outputs:
        parameters:
          - name: cohort-id
            valueFrom:
              path: /tmp/cohort-id
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: "{{workflow.parameters.source-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - blackduck-wintermute-cohort-source
        args:
          - --scope
          - parent-rollup
          - --strict
          - --resolve-bom-names
          - --workers
          - "8"
          - --component-workers
          - "2"
          - --page-limit
          - "500"
          - --minimum-score
          - "7"
          - --skip-policy-rule-details
          - --lineage-cache-max-age-days
          - "7"
          - --trust-lineage-cache-without-update-marker
          - --cohort-root
          - /var/lib/blackduck-wintermute/cohorts
          - --cohort-id-out
          - /tmp/cohort-id
        envFrom:
          - secretRef:
              name: blackduck-wintermute-blackduck-credentials
        env:
          - name: WINTERMUTE_OUTPUT_DIR
            value: /var/lib/blackduck-wintermute/source
          - name: TMPDIR
            value: /tmp
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: cohort-data
            mountPath: /var/lib/blackduck-wintermute/cohorts
          - name: source-data
            mountPath: /var/lib/blackduck-wintermute/source
          - name: tmp
            mountPath: /tmp

    - name: scm
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: "{{workflow.parameters.scm-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - blackduck-wintermute-scm-overview
        args:
          - --output-root
          - /var/lib/blackduck-wintermute
          - --workers
          - "1"
          - --evidence-workers
          - "1"
          - --scan-evidence-workers
          - "1"
          - --page-limit
          - "100"
          - --max-hours
          - "2"
        envFrom:
          - secretRef:
              name: blackduck-wintermute-blackduck-credentials
          - secretRef:
              name: blackduck-wintermute-scm-credentials
        env:
          - name: WINTERMUTE_OUTPUT_DIR
            value: /var/lib/blackduck-wintermute
          - name: TMPDIR
            value: /tmp
          - name: WINTERMUTE_BLACKDUCK_REQUEST_INTERVAL_SECONDS
            value: "0.5"
          - name: WINTERMUTE_BLACKDUCK_CIRCUIT_BREAKER_THRESHOLD
            value: "5"
          - name: WINTERMUTE_BLACKDUCK_CIRCUIT_BREAKER_WINDOW_SECONDS
            value: "60"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: scm-data
            mountPath: /var/lib/blackduck-wintermute/scm
          - name: tmp
            mountPath: /tmp

    - name: jira
      inputs:
        parameters:
          - name: cohort-id
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: "{{workflow.parameters.jira-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - blackduck-wintermute-jira-cohort
        args:
          - --cohort
          - "/var/lib/blackduck-wintermute/cohorts/{{inputs.parameters.cohort-id}}"
          - "--{{workflow.parameters.jira-mode}}"
          - --strict
          - --only-vulnerability
          - "{{workflow.parameters.jira-only-vulnerability}}"
          - --max-create
          - "{{workflow.parameters.jira-max-create}}"
          - --config
          - /etc/blackduck-wintermute/jira-rollup-config.json
        envFrom:
          - secretRef:
              name: blackduck-wintermute-jira-credentials
        env:
          - name: WINTERMUTE_OUTPUT_DIR
            value: /var/lib/blackduck-wintermute
          - name: TMPDIR
            value: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: cohort-data
            mountPath: /var/lib/blackduck-wintermute/cohorts
            readOnly: true
          - name: jira-data
            mountPath: /var/lib/blackduck-wintermute/destinations/jira
          - name: jira-config
            mountPath: /etc/blackduck-wintermute/jira-rollup-config.json
            subPath: jira-rollup-config.json
            readOnly: true
          - name: tmp
            mountPath: /tmp

    - name: datadog
      inputs:
        parameters:
          - name: cohort-id
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: "{{workflow.parameters.datadog-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - blackduck-wintermute-datadog-cohort
        args:
          - --cohort
          - "/var/lib/blackduck-wintermute/cohorts/{{inputs.parameters.cohort-id}}"
          - "--{{workflow.parameters.datadog-mode}}"
          - --strict
          - --max-send
          - "{{workflow.parameters.datadog-max-send}}"
        envFrom:
          - secretRef:
              name: blackduck-wintermute-datadog-credentials
        env:
          - name: WINTERMUTE_OUTPUT_DIR
            value: /var/lib/blackduck-wintermute
          - name: TMPDIR
            value: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: cohort-data
            mountPath: /var/lib/blackduck-wintermute/cohorts
            readOnly: true
          - name: datadog-data
            mountPath: /var/lib/blackduck-wintermute/destinations/datadog
          - name: tmp
            mountPath: /tmp

    - name: finalize
      inputs:
        parameters:
          - name: cohort-id
          - name: jira-status
          - name: datadog-status
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: "{{workflow.parameters.source-image}}"
        imagePullPolicy: IfNotPresent
        command:
          - python
          - -m
          - wintermute.blackduck.cohort_finalize
        args:
          - --cohort-root
          - /var/lib/blackduck-wintermute/cohorts
          - --cohort-id
          - "{{inputs.parameters.cohort-id}}"
          - --retain-cohorts
          - "{{workflow.parameters.retain-cohorts}}"
          - --jira-mode
          - "{{workflow.parameters.jira-mode}}"
          - --datadog-mode
          - "{{workflow.parameters.datadog-mode}}"
          - --jira-status
          - "{{inputs.parameters.jira-status}}"
          - --datadog-status
          - "{{inputs.parameters.datadog-status}}"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: cohort-data
            mountPath: /var/lib/blackduck-wintermute/cohorts
