[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unofficialblackduck-wintermute"
version = "0.2.0"
description = "Utility scripts for Black Duck vulnerability rollups, Jira, and Datadog workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "racheldevops" }
]
dependencies = []

[project.scripts]
blackduck-find-parents = "wintermute.jira.find_parent_projects:main"
blackduck-vuln-rollup = "wintermute.jira.subp_vuln_rollup:main"
blackduck-hierarchy-plan = "wintermute.jira.findings_hierarchy_plan:main"
blackduck-findings-to-jira = "wintermute.jira.findings_to_jira:main"
blackduck-jira-pipeline = "wintermute.jira.pipeline:main"
blackduck-policy-vuln-find = "wintermute.datadog.policy_vuln_find:main"
blackduck-policy-vuln-pull = "wintermute.datadog.policy_vuln_pull:main"
blackduck-findings-to-datadog = "wintermute.datadog.findings_to_datadog:main"
blackduck-wintermute-pull = "wintermute.blackduck.cli:main"
blackduck-wintermute-cohort-source = "wintermute.blackduck.cohort_source:main"
blackduck-wintermute-jira-cohort = "wintermute.jira.cohort_pipeline:main"
blackduck-wintermute-datadog-cohort = "wintermute.datadog.cohort_pipeline:main"
blackduck-wintermute-cohort-finalize = "wintermute.blackduck.cohort_finalize:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wintermute*"]

[tool.setuptools.package-data]
"wintermute.jira" = ["config/*.json"]
