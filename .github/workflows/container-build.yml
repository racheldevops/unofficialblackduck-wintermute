name: Compatibility Jira container build

on:
  workflow_dispatch:
    inputs:
      build_push:
        description: building container and push to registry?
        required: true
        default: nope
        type: choice
        options:
          - yep
          - nope

permissions:
  contents: read

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_REPOSITORY: ${{ vars.REGISTRY_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate registry configuration
        if: ${{ inputs.build_push == 'yep' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REGISTRY_HOST}" || {
            echo "REGISTRY_HOST repository variable is required"
            exit 1
          }
          test -n "${REGISTRY_REPOSITORY}" || {
            echo "REGISTRY_REPOSITORY repository variable is required"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install and test package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m compileall -q src/wintermute
          python -m pytest -q tests
          python scripts/validate_entrypoints.py --require-installed

      - name: Set up Docker Buildx
        if: ${{ inputs.build_push == 'yep' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        if: ${{ inputs.build_push == 'yep' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: ${{ inputs.build_push == 'yep' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.build_push == 'yep' }}
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Write image summary
        if: ${{ inputs.build_push == 'yep' }}
        shell: bash
        run: |
          {
            echo "## Container image"
            echo
            echo "Image: ${REGISTRY_HOST}/${REGISTRY_REPOSITORY}:${IMAGE_TAG}"
            echo
            echo "Digest: ${{ steps.build.outputs.digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"
