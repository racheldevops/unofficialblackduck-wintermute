name: Cohort container build

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - tests/**
      - .github/workflows/cohort-container-build.yml
  workflow_dispatch:
    inputs:
      push_images:
        description: Push immutable cohort images
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Test
        env:
          WINTERMUTE_OUTPUT_DIR: ${{ runner.temp }}/wintermute-tests
        run: python -m pytest -q tests

      - name: Validate entry points
        run: python scripts/validate_entrypoints.py --require-installed

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: source
            image_suffix: source
          - target: jira
            image_suffix: jira
          - target: datadog
            image_suffix: datadog

    steps:
      - uses: actions/checkout@v4

      - name: Build image target
        run: |
          docker build \
            --target "${{ matrix.target }}" \
            --tag "blackduck-wintermute-${{ matrix.image_suffix }}:ci" \
            .

      - name: Validate image entry point
        run: |
          docker run \
            --rm \
            "blackduck-wintermute-${{ matrix.image_suffix }}:ci" \
            --help

      - name: Log in to private registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push immutable image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images }}
        env:
          IMAGE: >-
            ${{ vars.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}-${{ matrix.image_suffix }}:${{ github.sha }}
        run: |
          docker buildx build \
            --target "${{ matrix.target }}" \
            --tag "${IMAGE}" \
            --push \
            .

          docker buildx imagetools inspect "${IMAGE}" \
            > "image-${{ matrix.image_suffix }}.txt"

      - name: Upload pushed image metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images }}
        uses: actions/upload-artifact@v4
        with:
          name: cohort-image-${{ matrix.image_suffix }}
          path: image-${{ matrix.image_suffix }}.txt
          if-no-files-found: error
